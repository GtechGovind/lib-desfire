version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /src/dashboard/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    # Keep compiler updates inside typescript-eslint 8.73's supported range.
    # Upgrade the compiler and parser together before accepting TypeScript 6.1+.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      development:
        dependency-type: development
        exclude-patterns: ["@types/react", "@types/react-dom"]
