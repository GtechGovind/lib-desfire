name: Bug report
description: Report a reproducible problem with the library or local console.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use [private reporting](https://github.com/GtechGovind/lib-desfire/security/advisories/new).
        Do not include real keys, card identifiers, dumps or protected traffic.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler, CMake/OpenSSL versions and component. For hardware issues, include reader model and card family only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give a minimal reproduction with synthetic data and no credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior
      description: Include sanitized errors and delivery outcomes, if available.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and removed credentials, card identifiers and protected traffic.
          required: true
