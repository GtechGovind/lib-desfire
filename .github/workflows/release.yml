name: Source release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Verify tag, build and package source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(lib_desfire VERSION ([0-9.]+) .*/\1/p' CMakeLists.txt)
          test "$RELEASE_TAG" = "v$version"
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release --parallel 2
          cmake --install build/release --prefix "$GITHUB_WORKSPACE/install"
          cmake -S examples/consumer -B build/consumer -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"
          cmake --build build/consumer --parallel 2
          ctest --test-dir build/consumer --output-on-failure
          (cd build/release && cpack --config CPackSourceConfig.cmake)
          mkdir -p release
          cp "build/release/lib-desfire-$version-source.zip" release/
          (cd release && sha256sum *.zip > SHA256SUMS)
      - name: Create draft release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
